version: '3.8'

services:
  intellisearch-backend:
    build: .
    container_name: intellisearch-v2
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_storage:/app/chroma_storage
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
